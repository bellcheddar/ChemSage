<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ChemSage — AI Chemistry Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #21262d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --faint:   #484f58;
      --accent:  #00d4ff;
      --ok:      #3fb950;
      --warn:    #f0883e;
      --danger:  #f85149;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* dvh accounts for mobile browser chrome (address bar, etc.) */
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      /* Safe areas for notched/rounded-corner devices */
      padding-top:    env(safe-area-inset-top);
      padding-left:   env(safe-area-inset-left);
      padding-right:  env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── header ── */
    header {
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      min-width: 0;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.03em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge {
      font-size: 0.58rem;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 20px;
      background: rgba(0,212,255,0.07);
      border: 1px solid rgba(0,212,255,0.18);
      color: rgba(0,212,255,0.7);
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    @media (max-width: 380px) { .badge { display: none; } }

    .hspace { flex: 1; min-width: 0; }

    #kbd-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 22px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #kbd-btn:active { background: var(--border); }
    @media (hover: none) and (pointer: coarse) { #kbd-btn { display: flex; } }

    .conn-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warn);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .conn-dot.connected    { background: var(--ok); }
    .conn-dot.disconnected { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .conn-dot.connecting   { animation: pulse 1s infinite; }
    .conn-label {
      font-size: 0.65rem;
      color: var(--muted);
      white-space: nowrap;
    }
    @media (max-width: 480px) { .conn-label { display: none; } }

    /* ── terminal container ── */
    #term-wrap {
      flex: 1 1 0;
      min-height: 0;        /* critical: lets flex child shrink below intrinsic size */
      position: relative;
      overflow: hidden;
      background: var(--bg);
      /* Small inset so xterm canvas doesn't paste to the very edge.
         Important: put padding here, NOT on .xterm — xterm's fitAddon
         reads #terminal's bounding rect, so padding here correctly
         reduces available cols/rows. */
      padding: 3px 5px;
    }

    #terminal {
      width: 100%;
      height: 100%;
    }

    /* ── footer ── */
    footer {
      flex: 0 0 24px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 0.64rem;
      color: var(--faint);
      overflow: hidden;
    }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }
    .fsep { margin: 0 5px; }
    .fright {
      margin-left: auto;
      font-family: 'Cascadia Code','Fira Code','JetBrains Mono',monospace;
      white-space: nowrap;
      flex-shrink: 0;
    }
    @media (max-width: 480px) {
      .fauthor { display: none; }
      footer { justify-content: center; }
      .fright { margin-left: 0; }
    }

    /* ── loading overlay ── */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(13,17,23,0.88);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 50;
      transition: opacity 0.25s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ovr-text { font-size: 0.75rem; color: var(--muted); }

    /* ── mobile keyboard textarea ── */
    #mkbd {
      position: fixed;
      left: -9999px; top: 0;
      width: 1px; height: 1px;
      opacity: 0; border: none; outline: none; resize: none;
      -webkit-user-select: text; user-select: text;
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">⚗</span>
    <span class="badge">32B · QLoRA R5 · RAG</span>
    <span class="hspace"></span>
    <button id="kbd-btn" aria-label="Show keyboard">⌨</button>
    <span class="conn-wrap">
      <span class="conn-dot connecting" id="conn-dot"></span>
      <span class="conn-label" id="conn-label">Connecting</span>
    </span>
  </header>

  <div id="term-wrap">
    <div id="terminal"></div>
    <div id="overlay">
      <div class="spinner"></div>
      <span class="ovr-text">Starting ChemSage…</span>
    </div>
  </div>

  <footer>
    <span class="fauthor">
      <a href="https://marcdeller.com" target="_blank" rel="noopener">Marc C. Deller, D.Phil.</a>
      <span class="fsep">·</span>
      <a href="https://github.com/bellcheddar/ChemSage" target="_blank" rel="noopener">GitHub</a>
      <span class="fsep">·</span>
      <a href="https://huggingface.co/Dellboy" target="_blank" rel="noopener">HuggingFace</a>
    </span>
    <span class="fright">Type <code>/help</code> for commands</span>
  </footer>

  <textarea id="mkbd" autocomplete="off" autocorrect="off"
    autocapitalize="none" spellcheck="false" tabindex="-1"></textarea>

  <script>
    // ── font size: pick before opening terminal so xterm measures right chars ──
    const vw = window.innerWidth;
    const fontSize = vw < 400 ? 9 : vw < 500 ? 10 : vw < 700 ? 11 : vw < 900 ? 13 : 14;

    // ── terminal init ──────────────────────────────────────────────────────────
    const term = new Terminal({
      theme: {
        background:    '#0d1117', foreground:    '#e6edf3',
        cursor:        '#00d4ff', cursorAccent:  '#0d1117',
        selectionBackground: 'rgba(0,212,255,0.2)',
        black:         '#484f58', red:           '#ff7b72',
        green:         '#3fb950', yellow:        '#d29922',
        blue:          '#58a6ff', magenta:       '#bc8cff',
        cyan:          '#39c5cf', white:         '#b1bac4',
        brightBlack:   '#6e7681', brightRed:     '#ffa198',
        brightGreen:   '#56d364', brightYellow:  '#e3b341',
        brightBlue:    '#79c0ff', brightMagenta: '#d2a8ff',
        brightCyan:    '#56d4dd', brightWhite:   '#f0f6fc',
      },
      fontFamily: "'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace",
      fontSize,
      lineHeight: 1.35,
      cursorBlink: true,
      cursorStyle: 'block',
      scrollback: 5000,
      allowProposedApi: true,
    });

    const fitAddon      = new FitAddon.FitAddon();
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(webLinksAddon);
    term.open(document.getElementById('terminal'));

    // ── WebSocket variable declared here so event handlers can close over it ──
    let ws;

    // Resize helper — also sends a message to the server to update PTY dims
    function sendResize() {
      if (ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }

    term.onData(data => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(data); });
    term.onResize(() => sendResize());

    // ── Fit + connect: double-RAF so xterm renderer has measured cell dims ────
    // fitAddon.fit() calls _getDimensions() which reads `actualCellWidth` from
    // the renderer. This is only populated after the browser has completed a
    // render cycle with the terminal's font. If we call fit() synchronously
    // after term.open(), actualCellWidth is 0 and fit() silently no-ops,
    // leaving term.cols at the xterm default (80). Double-RAF guarantees the
    // browser has painted at least once.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fitAddon.fit();

      const cols = Math.max(term.cols || 40, 20);
      const rows = Math.max(term.rows || 24, 5);
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws?cols=${cols}&rows=${rows}`);

      const dot   = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');

      ws.onopen = () => {
        document.getElementById('overlay').classList.add('hidden');
        dot.className     = 'conn-dot connected';
        label.textContent = 'Connected';
        // Force a resize signal so resumed sessions also get the right size.
        sendResize();
      };

      ws.onmessage = e => term.write(e.data);

      ws.onclose = () => {
        dot.className     = 'conn-dot disconnected';
        label.textContent = 'Disconnected';
        term.write('\r\n\r\n\x1b[31mSession ended. Refresh to reconnect.\x1b[0m\r\n');
      };

      ws.onerror = () => {
        document.getElementById('overlay').classList.add('hidden');
        term.write('\x1b[31mWebSocket error — check server logs.\x1b[0m\r\n');
      };
    }));

    // ── Resize handling ────────────────────────────────────────────────────────
    let fitTimer;
    function scheduleFit(ms) {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => { try { fitAddon.fit(); } catch(_){} }, ms ?? 40);
    }

    window.addEventListener('resize', () => scheduleFit());

    // visualViewport fires for on-screen keyboard show/hide; window.resize does not.
    if (window.visualViewport)
      window.visualViewport.addEventListener('resize', () => scheduleFit());

    // Responsive font: re-measure when viewport width changes meaningfully
    let lastVw = window.innerWidth;
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      if (Math.abs(w - lastVw) < 20) return;  // ignore tiny shifts
      lastVw = w;
      const sz = w < 400 ? 9 : w < 500 ? 10 : w < 700 ? 11 : w < 900 ? 13 : 14;
      if (term.options.fontSize !== sz) {
        term.options.fontSize = sz;
        scheduleFit(80);
      }
    });

    // ── Mobile keyboard capture ────────────────────────────────────────────────
    const mkbd = document.getElementById('mkbd');

    const KEYS = {
      Enter:'\r', Backspace:'\x7f', Delete:'\x1b[3~', Tab:'\t', Escape:'\x1b',
      ArrowUp:'\x1b[A', ArrowDown:'\x1b[B', ArrowRight:'\x1b[C', ArrowLeft:'\x1b[D',
      Home:'\x1b[H', End:'\x1b[F', PageUp:'\x1b[5~', PageDown:'\x1b[6~',
    };

    mkbd.addEventListener('keydown', e => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const seq = KEYS[e.key];
      if (seq) { ws.send(seq); e.preventDefault(); return; }
      if (e.ctrlKey && e.key.length === 1) {
        const c = e.key.toUpperCase().charCodeAt(0) - 64;
        if (c > 0 && c < 32) ws.send(String.fromCharCode(c));
        e.preventDefault();
      }
    });

    mkbd.addEventListener('input', () => {
      const v = mkbd.value;
      if (v && ws && ws.readyState === WebSocket.OPEN) { ws.send(v); mkbd.value = ''; }
    });

    function showKbd() {
      mkbd.style.pointerEvents = 'auto';
      mkbd.focus();
      mkbd.style.pointerEvents = 'none';
    }

    document.getElementById('term-wrap').addEventListener('touchend', e => {
      if (e.target.tagName === 'A') return;
      e.preventDefault();
      showKbd();
    }, { passive: false });

    document.getElementById('kbd-btn').addEventListener('click', showKbd);
  </script>
</body>
</html>
