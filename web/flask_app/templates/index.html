<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ChemSage — AI Chemistry Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #21262d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --faint:   #484f58;
      --accent:  #00d4ff;
      --ok:      #3fb950;
      --warn:    #f0883e;
      --danger:  #f85149;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top:    env(safe-area-inset-top);
      padding-left:   env(safe-area-inset-left);
      padding-right:  env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── header: keyboard toggle + connection only ── */
    header {
      flex: 0 0 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #kbd-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 20px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 0.68rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #kbd-btn:active { background: var(--border); }
    @media (hover: none) and (pointer: coarse) { #kbd-btn { display: flex; } }

    .conn-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .conn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warn);
      transition: background 0.3s;
    }
    .conn-dot.connected    { background: var(--ok);    box-shadow: 0 0 5px rgba(63,185,80,0.45); }
    .conn-dot.disconnected { background: var(--danger); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .conn-dot.connecting   { animation: pulse 1s infinite; }
    .conn-label {
      font-size: 0.63rem;
      color: var(--muted);
      white-space: nowrap;
    }
    @media (max-width: 480px) { .conn-label { display: none; } }

    /* ── terminal container ── */
    #term-wrap {
      flex: 1 1 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      padding: 3px 5px;
    }

    #terminal { width: 100%; height: 100%; }

    /* ── footer: two rows ── */
    footer {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      font-family: 'Cascadia Code','Fira Code','JetBrains Mono',monospace;
    }

    .f-row {
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 20px;
      gap: 6px;
      flex-shrink: 0;
    }
    .f-row + .f-row { border-top: 1px solid rgba(255,255,255,0.04); }
    .f-row-spec { background: rgba(255,255,255,0.02); }

    .f-model {
      font-size: 0.61rem;
      color: var(--faint);
      white-space: nowrap;
    }
    .f-sep { font-size: 0.61rem; color: var(--faint); }
    .f-link {
      font-size: 0.61rem;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
    }
    .f-link:hover { color: var(--accent); }
    .f-right { margin-left: auto; }
    .f-hint {
      font-size: 0.61rem;
      color: var(--faint);
      white-space: nowrap;
    }
    .f-hint code {
      color: rgba(0,212,255,0.7);
      font-family: inherit;
    }

    /* cold-start pill — always visible */
    .pill-cold {
      font-size: 0.58rem;
      font-weight: 500;
      padding: 1px 6px;
      border-radius: 20px;
      background: rgba(240,136,62,0.1);
      border: 1px solid rgba(240,136,62,0.25);
      color: var(--warn);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* thinking pill — hidden until prompt sent */
    #thinking-pill {
      display: none;
      font-size: 0.58rem;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: 20px;
      background: rgba(63,185,80,0.1);
      border: 1px solid rgba(63,185,80,0.28);
      color: var(--ok);
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .f-row-links .f-link:not(:first-of-type),
      .f-row-links .f-sep { display: none; }
      .f-row-links .f-link:first-of-type { display: block; }
    }

    /* ── loading overlay ── */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(13,17,23,0.88);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 50;
      transition: opacity 0.25s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ovr-text { font-size: 0.75rem; color: var(--muted); }

    /* ── mobile keyboard textarea ── */
    #mkbd {
      position: fixed;
      left: -9999px; top: 0;
      width: 1px; height: 1px;
      opacity: 0; border: none; outline: none; resize: none;
      -webkit-user-select: text; user-select: text;
    }
  </style>
</head>
<body>

  <header>
    <button id="kbd-btn" aria-label="Show keyboard">⌨</button>
    <span class="conn-wrap">
      <span class="conn-dot connecting" id="conn-dot"></span>
      <span class="conn-label" id="conn-label">Connecting</span>
    </span>
  </header>

  <div id="term-wrap">
    <div id="terminal"></div>
    <div id="overlay">
      <div class="spinner"></div>
      <span class="ovr-text">Starting ChemSage…</span>
    </div>
  </div>

  <footer>
    <!-- row 1: model spec + status pills + /help -->
    <div class="f-row f-row-spec">
      <span class="f-model">32B · QLoRA R5 · ZeroGPU A10G</span>
      <span class="pill-cold">cold start ~30 s</span>
      <span id="thinking-pill">Thinking</span>
      <span class="f-hint f-right">Type <code>/help</code> for commands</span>
    </div>
    <!-- row 2: external links -->
    <div class="f-row f-row-links">
      <a class="f-link" href="https://marcdeller.com"                         target="_blank" rel="noopener">marcdeller.com</a>
      <span class="f-sep">·</span>
      <a class="f-link" href="https://github.com/bellcheddar/ChemSage"        target="_blank" rel="noopener">GitHub</a>
      <span class="f-sep">·</span>
      <a class="f-link" href="https://huggingface.co/Dellboy"                 target="_blank" rel="noopener">HuggingFace</a>
    </div>
  </footer>

  <textarea id="mkbd" autocomplete="off" autocorrect="off"
    autocapitalize="none" spellcheck="false" tabindex="-1"></textarea>

  <script>
    // ── font size ──────────────────────────────────────────────────────────────
    const vw = window.innerWidth;
    const fontSize = vw < 400 ? 9 : vw < 500 ? 10 : vw < 700 ? 11 : vw < 900 ? 13 : 14;

    // ── terminal init ──────────────────────────────────────────────────────────
    const term = new Terminal({
      theme: {
        background:    '#0d1117', foreground:    '#e6edf3',
        cursor:        '#00d4ff', cursorAccent:  '#0d1117',
        selectionBackground: 'rgba(0,212,255,0.2)',
        black:         '#484f58', red:           '#ff7b72',
        green:         '#3fb950', yellow:        '#d29922',
        blue:          '#58a6ff', magenta:       '#bc8cff',
        cyan:          '#39c5cf', white:         '#b1bac4',
        brightBlack:   '#6e7681', brightRed:     '#ffa198',
        brightGreen:   '#56d364', brightYellow:  '#e3b341',
        brightBlue:    '#79c0ff', brightMagenta: '#d2a8ff',
        brightCyan:    '#56d4dd', brightWhite:   '#f0f6fc',
      },
      fontFamily: "'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace",
      fontSize,
      lineHeight: 1.35,
      cursorBlink: true,
      cursorStyle: 'block',
      scrollback: 5000,
      allowProposedApi: true,
    });

    const fitAddon      = new FitAddon.FitAddon();
    const webLinksAddon = new WebLinksAddon.WebLinksAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(webLinksAddon);
    term.open(document.getElementById('terminal'));

    let ws;

    function sendResize() {
      if (ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }

    // ── Thinking pill ──────────────────────────────────────────────────────────
    const thinkingPill = document.getElementById('thinking-pill');
    let thinkingDots   = 0;
    let thinkingTimer  = null;
    let thinkingShownAt = 0;

    function showThinking() {
      thinkingDots = 0;
      thinkingPill.textContent = 'Thinking';
      thinkingPill.style.display = 'inline-block';
      thinkingShownAt = Date.now();
      thinkingTimer = setInterval(() => {
        thinkingDots = (thinkingDots + 1) % 4;
        thinkingPill.textContent = 'Thinking' + '.'.repeat(thinkingDots);
      }, 400);
    }

    function hideThinking() {
      if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
      thinkingPill.style.display = 'none';
    }

    // ── send keystrokes; show Thinking pill on Enter ───────────────────────────
    term.onData(data => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(data);
        if (data === '\r') showThinking();
      }
    });

    term.onResize(() => sendResize());

    // ── connect ────────────────────────────────────────────────────────────────
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fitAddon.fit();

      const cols  = Math.max(term.cols || 40, 20);
      const rows  = Math.max(term.rows || 24, 5);
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws?cols=${cols}&rows=${rows}`);

      const dot   = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');

      ws.onopen = () => {
        document.getElementById('overlay').classList.add('hidden');
        dot.className     = 'conn-dot connected';
        label.textContent = 'Connected';
        sendResize();
      };

      ws.onmessage = e => {
        term.write(e.data);
        // Hide Thinking pill once real response data arrives.
        // 600 ms grace period absorbs the immediate PTY echo of the newline.
        if (thinkingTimer && Date.now() - thinkingShownAt > 600) {
          hideThinking();
        }
      };

      ws.onclose = () => {
        dot.className     = 'conn-dot disconnected';
        label.textContent = 'Disconnected';
        hideThinking();
        term.write('\r\n\r\n\x1b[31mSession ended. Refresh to reconnect.\x1b[0m\r\n');
      };

      ws.onerror = () => {
        document.getElementById('overlay').classList.add('hidden');
        hideThinking();
        term.write('\x1b[31mWebSocket error — check server logs.\x1b[0m\r\n');
      };
    }));

    // ── resize handling ────────────────────────────────────────────────────────
    let fitTimer;
    function scheduleFit(ms) {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => { try { fitAddon.fit(); } catch(_){} }, ms ?? 40);
    }

    window.addEventListener('resize', () => scheduleFit());

    if (window.visualViewport)
      window.visualViewport.addEventListener('resize', () => scheduleFit());

    let lastVw = window.innerWidth;
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      if (Math.abs(w - lastVw) < 20) return;
      lastVw = w;
      const sz = w < 400 ? 9 : w < 500 ? 10 : w < 700 ? 11 : w < 900 ? 13 : 14;
      if (term.options.fontSize !== sz) {
        term.options.fontSize = sz;
        scheduleFit(80);
      }
    });

    // ── mobile keyboard capture ────────────────────────────────────────────────
    const mkbd = document.getElementById('mkbd');

    const KEYS = {
      Enter:'\r', Backspace:'\x7f', Delete:'\x1b[3~', Tab:'\t', Escape:'\x1b',
      ArrowUp:'\x1b[A', ArrowDown:'\x1b[B', ArrowRight:'\x1b[C', ArrowLeft:'\x1b[D',
      Home:'\x1b[H', End:'\x1b[F', PageUp:'\x1b[5~', PageDown:'\x1b[6~',
    };

    mkbd.addEventListener('keydown', e => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const seq = KEYS[e.key];
      if (seq) { ws.send(seq); e.preventDefault(); return; }
      if (e.ctrlKey && e.key.length === 1) {
        const c = e.key.toUpperCase().charCodeAt(0) - 64;
        if (c > 0 && c < 32) ws.send(String.fromCharCode(c));
        e.preventDefault();
      }
    });

    mkbd.addEventListener('input', () => {
      const v = mkbd.value;
      if (v && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(v);
        mkbd.value = '';
        // treat soft-keyboard submit (virtual Enter) as Enter
        if (v.endsWith('\n') || v.endsWith('\r')) showThinking();
      }
    });

    function showKbd() {
      mkbd.style.pointerEvents = 'auto';
      mkbd.focus();
      mkbd.style.pointerEvents = 'none';
    }

    document.getElementById('term-wrap').addEventListener('touchend', e => {
      if (e.target.tagName === 'A') return;
      e.preventDefault();
      showKbd();
    }, { passive: false });

    document.getElementById('kbd-btn').addEventListener('click', showKbd);
  </script>
</body>
</html>
